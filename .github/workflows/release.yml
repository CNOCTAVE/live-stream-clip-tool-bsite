name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (win-x64, self-contained)
        run: >
          dotnet publish src/LiveStreamClipTool/LiveStreamClipTool.csproj
          -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish

      - name: Add license and readme
        shell: pwsh
        run: Copy-Item LICENSE, README.md publish/

      - name: Create archive
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "manual-${{ github.run_number }}"
          }
          Compress-Archive -Path publish/* -DestinationPath "LiveStreamClipTool-win-x64-$tag.zip" -Force

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          "LiveStreamClipTool-win-x64-${{ github.event.release.tag_name }}.zip" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveStreamClipTool-win-x64
          path: LiveStreamClipTool-win-x64-*.zip
          if-no-files-found: error
